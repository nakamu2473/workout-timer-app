<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E4"/>
      <stop offset="100%" stop-color="#E6DCC8"/>
    </linearGradient>
  </defs>

  <!-- 背景。scripts/generate-icons.mjs がこの rect から角丸を外して
       maskable / apple-touch 用の全面塗りを書き出す -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ダンベル：線幅をそろえたモノライン。中心(256,256)対称、
       絵柄は中心から半径205px以内に収めてマスカブルの安全領域に入れている -->
  <g stroke="#241F4D" stroke-linecap="round" fill="none">
    <line x1="182" y1="256" x2="330" y2="256" stroke-width="34"/>
    <line x1="160" y1="191" x2="160" y2="321" stroke-width="38"/>
    <line x1="352" y1="191" x2="352" y2="321" stroke-width="38"/>
    <line x1="104" y1="220" x2="104" y2="292" stroke-width="34"/>
    <line x1="408" y1="220" x2="408" y2="292" stroke-width="34"/>
  </g>
</svg>
